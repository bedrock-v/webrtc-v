name: Package

# Publishes the container image described in the Dockerfile: V with this
# library already linked, and the examples built.
#
# It is a convenience for trying the library and for running the suite in a
# known-good environment, not a deployment artifact - this repository is a
# library and has no service to run.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The layer cache lives with the workflow, so an unchanged tree does
          # not rebuild the V toolchain image every time.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image actually runs
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA}"
          docker run --rm "$image" | tee /tmp/out.txt
          grep -q "connected in" /tmp/out.txt
