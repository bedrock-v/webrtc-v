name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so that a break caused by a new V release is found before someone
  # else finds it.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VFLAGS: -no-parallel
  V_REF: 316db75a07afe50a17c5e273a18d10af8e8068d1
  VC_REF: d31eceeb33b7356676c7fba0a80736d370923c34

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webrtc-v
    steps:
      - name: Checkout V
        uses: actions/checkout@v7
        with:
          repository: vlang/v
          ref: ${{ env.V_REF }}
      - name: Checkout VC
        uses: actions/checkout@v7
        with:
          repository: vlang/vc
          ref: ${{ env.VC_REF }}
          path: vc
      - name: Checkout webrtc-v
        uses: actions/checkout@v7
        with:
          path: webrtc-v
      - name: Build V
        working-directory: .
        run: |
          make latest_tcc
          make local=1
          echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"
      - name: Link the module into V's module path
        run: ln -s "$PWD" "$HOME/.vmodules/webrtc"
      - name: Verify formatting
        run: make fmt-check

  vet:
    name: Vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webrtc-v
    steps:
      - name: Checkout V
        uses: actions/checkout@v7
        with:
          repository: vlang/v
          ref: ${{ env.V_REF }}
      - name: Checkout VC
        uses: actions/checkout@v7
        with:
          repository: vlang/vc
          ref: ${{ env.VC_REF }}
          path: vc
      - name: Checkout webrtc-v
        uses: actions/checkout@v7
        with:
          path: webrtc-v
      - name: Build V
        working-directory: .
        run: |
          make latest_tcc
          make local=1
          echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"
      - name: Link the module into V's module path
        run: ln -s "$PWD" "$HOME/.vmodules/webrtc"
      - name: Vet
        run: make vet

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: webrtc-v
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout V
        uses: actions/checkout@v7
        with:
          repository: vlang/v
          ref: ${{ env.V_REF }}
      - name: Checkout VC
        uses: actions/checkout@v7
        with:
          repository: vlang/vc
          ref: ${{ env.VC_REF }}
          path: vc
      - name: Checkout webrtc-v
        uses: actions/checkout@v7
        with:
          path: webrtc-v
      - name: Build V
        working-directory: .
        run: |
          make latest_tcc
          make local=1
          echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"
      - name: Link the module into V's module path
        run: ln -s "$PWD" "$HOME/.vmodules/webrtc"
      - name: Run the test suite
        run: make test
      # The suite includes tests that open loopback sockets and drive two ICE
      # agents through a full exchange. Running it a second time catches the
      # races and ordering bugs that only show up under a different schedule.
      - name: Run the test suite again
        run: make test

  test-windows:
    name: Test (windows, informational)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: webrtc-v
    # Keep the full Windows suite informational until its remaining platform
    # differences are resolved. The ICE interface enumeration itself is covered
    # here on a real Windows runner.
    #
    # It goes green again by making the port work, not by deleting this job.
    continue-on-error: true
    steps:
      - name: Checkout V
        uses: actions/checkout@v7
        with:
          repository: vlang/v
          ref: ${{ env.V_REF }}
      - name: Checkout VC
        uses: actions/checkout@v7
        with:
          repository: vlang/vc
          ref: ${{ env.VC_REF }}
          path: vc
      - name: Checkout webrtc-v
        uses: actions/checkout@v7
        with:
          path: webrtc-v
      - name: Build V
        shell: pwsh
        working-directory: .
        run: |
          .\makev.bat --local -gcc
          $env:GITHUB_WORKSPACE | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Link the module into V's module path
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$HOME\.vmodules" | Out-Null
          New-Item -ItemType Junction -Path "$HOME\.vmodules\webrtc" -Target "$PWD"
      # No make on the Windows runner, so the paths from the Makefile are
      # repeated here. They are still paths rather than ".", because the V
      # checkout and this repository share the workspace.
      - name: Run the test suite
        shell: pwsh
        run: |
          v test netaddr logging transport internal/codec internal/aes `
            internal/randutil stun stunclient turn mdns sdp rtp rtcp srtp ice `
            dtls sctp datachannel configuration.v connect.v data_channel.v `
            description.v media.v peer_connection.v stats.v webrtc_test.v
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            "Windows: the suite passed." | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          } else {
            "Windows: the suite failed (exit $code). This job remains informational while the remaining platform differences are resolved. The log above has the detail." |
              Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          }
          # Reported, not enforced: this is the state of an unfinished port.
          exit 0

  build:
    name: Build (${{ matrix.mode }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webrtc-v
    strategy:
      fail-fast: false
      matrix:
        # Production builds turn on optimisation and a different code path in
        # V's dead-code elimination, which has broken this project before.
        mode: [debug, prod]
    steps:
      - name: Checkout V
        uses: actions/checkout@v7
        with:
          repository: vlang/v
          ref: ${{ env.V_REF }}
      - name: Checkout VC
        uses: actions/checkout@v7
        with:
          repository: vlang/vc
          ref: ${{ env.VC_REF }}
          path: vc
      - name: Checkout webrtc-v
        uses: actions/checkout@v7
        with:
          path: webrtc-v
      - name: Build V
        working-directory: .
        run: |
          make latest_tcc
          make local=1
          echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"
      - name: Link the module into V's module path
        run: ln -s "$PWD" "$HOME/.vmodules/webrtc"
      - name: Build every module as a shared library
        run: |
          set -euo pipefail
          for module in netaddr logging transport internal/codec internal/aes internal/randutil \
                        stun stunclient turn mdns sdp rtp rtcp srtp ice dtls sctp datachannel; do
            echo "::group::$module"
            if [ "${{ matrix.mode }}" = "prod" ]; then
              v -prod -shared -check "$module"
            else
              v -shared -check "$module"
            fi
            echo "::endgroup::"
          done

  examples:
    name: Examples
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webrtc-v
    steps:
      - name: Checkout V
        uses: actions/checkout@v7
        with:
          repository: vlang/v
          ref: ${{ env.V_REF }}
      - name: Checkout VC
        uses: actions/checkout@v7
        with:
          repository: vlang/vc
          ref: ${{ env.VC_REF }}
          path: vc
      - name: Checkout webrtc-v
        uses: actions/checkout@v7
        with:
          path: webrtc-v
      - name: Build V
        working-directory: .
        run: |
          make latest_tcc
          make local=1
          echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"
      - name: Link the module into V's module path
        run: ln -s "$PWD" "$HOME/.vmodules/webrtc"
      - name: Build every example
        run: |
          set -euo pipefail
          for example in examples/*/; do
            name="$(basename "$example")"
            echo "::group::$name"
            v -o "/tmp/$name" "$example"
            echo "::endgroup::"
          done
      - name: Run the offline examples
        run: |
          set -euo pipefail
          v run examples/sdp-parse
          v run examples/rtp-roundtrip
          v run examples/ice-loopback
          v run examples/ice-dtls
          v run examples/datachannel
          v run examples/peer-connection

  hardening:
    name: Hardening
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webrtc-v
    steps:
      - name: Checkout V
        uses: actions/checkout@v7
        with:
          repository: vlang/v
          ref: ${{ env.V_REF }}
      - name: Checkout VC
        uses: actions/checkout@v7
        with:
          repository: vlang/vc
          ref: ${{ env.VC_REF }}
          path: vc
      - name: Checkout webrtc-v
        uses: actions/checkout@v7
        with:
          path: webrtc-v
      - name: Build V
        working-directory: .
        run: |
          make latest_tcc
          make local=1
          echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"
      - name: Link the module into V's module path
        run: ln -s "$PWD" "$HOME/.vmodules/webrtc"
      # The decoders take attacker-controlled input, and their tests feed them
      # thousands of structured-random byte strings. Running those under stricter
      # C warnings, without the garbage collector, and with optimisation on
      # exercises three different code paths through V's backend. A bug that only
      # appears in one of them is exactly the kind that reaches production.
      - name: Strict C warnings
        run: make harden-cstrict
      - name: Without the garbage collector
        run: make harden-gc-none
      - name: Optimised
        run: make harden-prod

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # gitleaks-action asks organisation-owned repositories for a paid licence.
      # The scanner is free, so the release binary is used directly.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.28.0
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          tar -C /tmp -xzf /tmp/gitleaks.tar.gz gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan for committed credentials
        run: gitleaks detect --source . --redact --no-banner --exit-code 1

  actions:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint the workflows
        uses: raven-actions/actionlint@v2
