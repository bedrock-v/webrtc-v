name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so that a break caused by a new V release is found before someone
  # else finds it.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VFLAGS: -no-parallel

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: vlang/setup-v@v1.7
        with:
          check-latest: true
      - name: Link the module into V's module path
        run: ln -s "$PWD" "$HOME/.vmodules/webrtc"
      - name: Verify formatting
        run: make fmt-check

  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: vlang/setup-v@v1.7
        with:
          check-latest: true
      - name: Link the module into V's module path
        run: ln -s "$PWD" "$HOME/.vmodules/webrtc"
      - name: Vet
        run: make vet

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: vlang/setup-v@v1.7
        with:
          check-latest: true
      - name: Link the module into V's module path
        run: ln -s "$PWD" "$HOME/.vmodules/webrtc"
      - name: Run the test suite
        run: make test
      # The suite includes tests that open loopback sockets and drive two ICE
      # agents through a full exchange. Running it a second time catches the
      # races and ordering bugs that only show up under a different schedule.
      - name: Run the test suite again
        run: make test

  test-windows:
    name: Test (windows, best effort)
    runs-on: windows-latest
    # Windows is not a supported platform yet: interface enumeration falls back
    # to one address per family. This job reports the state without gating the
    # branch on it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: vlang/setup-v@v1.7
        with:
          check-latest: true
      - name: Link the module into V's module path
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$HOME\.vmodules" | Out-Null
          New-Item -ItemType Junction -Path "$HOME\.vmodules\webrtc" -Target "$PWD"
      # No make on the Windows runner, so the paths from the Makefile are
      # repeated here. They are still paths rather than ".", because setup-v
      # puts the V compiler in the workspace.
      - name: Run the test suite
        run: >
          v test netaddr logging transport internal/codec internal/aes
          internal/randutil stun stunclient turn mdns sdp rtp rtcp srtp ice
          dtls sctp datachannel configuration.v connect.v data_channel.v
          description.v media.v peer_connection.v stats.v webrtc_test.v
