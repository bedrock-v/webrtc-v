name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so that a break caused by a new V release is found before someone
  # else finds it.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VFLAGS: -no-parallel

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vlang/setup-v@v1.4
        with:
          check-latest: true
      - name: Link the module into V's module path
        run: ln -s "$PWD" "$HOME/.vmodules/webrtc"
      - name: Verify formatting
        run: v fmt -verify .

  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vlang/setup-v@v1.4
        with:
          check-latest: true
      - name: Link the module into V's module path
        run: ln -s "$PWD" "$HOME/.vmodules/webrtc"
      - name: Vet
        run: v vet .
