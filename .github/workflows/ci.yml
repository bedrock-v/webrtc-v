name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so that a break caused by a new V release is found before someone
  # else finds it.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VFLAGS: -no-parallel

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vlang/setup-v@v1.4
        with:
          check-latest: true
      - name: Link the module into V's module path
        run: ln -s "$PWD" "$HOME/.vmodules/webrtc"
      - name: Verify formatting
        run: v fmt -verify .

  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vlang/setup-v@v1.4
        with:
          check-latest: true
      - name: Link the module into V's module path
        run: ln -s "$PWD" "$HOME/.vmodules/webrtc"
      - name: Vet
        run: v vet .

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: vlang/setup-v@v1.4
        with:
          check-latest: true
      - name: Link the module into V's module path
        run: ln -s "$PWD" "$HOME/.vmodules/webrtc"
      - name: Run the test suite
        run: v test .
      # The suite includes tests that open loopback sockets and drive two ICE
      # agents through a full exchange. Running it a second time catches the
      # races and ordering bugs that only show up under a different schedule.
      - name: Run the test suite again
        run: v test .

  test-windows:
    name: Test (windows, best effort)
    runs-on: windows-latest
    # Windows is not a supported platform yet: interface enumeration falls back
    # to one address per family. This job reports the state without gating the
    # branch on it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: vlang/setup-v@v1.4
        with:
          check-latest: true
      - name: Link the module into V's module path
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$HOME\.vmodules" | Out-Null
          New-Item -ItemType Junction -Path "$HOME\.vmodules\webrtc" -Target "$PWD"
      - name: Run the test suite
        run: v test .

  build:
    name: Build (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Production builds turn on optimisation and a different code path in
        # V's dead-code elimination, which has broken this project before.
        mode: [debug, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: vlang/setup-v@v1.4
        with:
          check-latest: true
      - name: Link the module into V's module path
        run: ln -s "$PWD" "$HOME/.vmodules/webrtc"
      - name: Build every module as a shared library
        run: |
          set -euo pipefail
          for module in netaddr logging transport internal/codec internal/aes internal/randutil \
                        stun stunclient turn mdns sdp rtp rtcp srtp ice dtls sctp datachannel; do
            echo "::group::$module"
            if [ "${{ matrix.mode }}" = "prod" ]; then
              v -prod -shared -check "$module"
            else
              v -shared -check "$module"
            fi
            echo "::endgroup::"
          done
