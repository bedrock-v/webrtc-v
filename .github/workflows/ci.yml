name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so that a break caused by a new V release is found before someone
  # else finds it.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VFLAGS: -no-parallel
